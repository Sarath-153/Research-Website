<!-- Hero Banner -->
<section class="bg-gradient-to-r from-[#002147] to-[#0056b3] py-10 text-center text-white">
  <p class="text-xs font-semibold tracking-widest uppercase opacity-80">Home &gt; About &gt; Vision &amp; Mission</p>
  <h1 class="mt-2 text-3xl font-extrabold md:text-4xl">Vision &amp; Mission</h1>
</section>

<!-- Content Cards -->
<main class="mx-auto max-w-6xl px-6 py-16">
  <div class="grid gap-10 md:grid-cols-2">
    <!-- Vision Card -->
    <div class="rounded-2xl border-l-8 border-[#fbc02d] bg-white p-8 shadow-xl transition-all hover:-translate-y-1 hover:shadow-2xl">
      <div class="mb-4 inline-flex h-14 w-14 items-center justify-center rounded-full bg-[#002147]/10 text-[#002147]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      </div>
      <h2 class="mb-4 text-2xl font-bold uppercase tracking-wider text-[#002147]">Our Vision</h2>
      <p class="text-lg leading-relaxed text-slate-600">{{ visionText }}</p>
    </div>

    <!-- Mission Card -->
    <div class="rounded-2xl border-l-8 border-[#0056b3] bg-white p-8 shadow-xl transition-all hover:-translate-y-1 hover:shadow-2xl">
      <div class="mb-4 inline-flex h-14 w-14 items-center justify-center rounded-full bg-[#0056b3]/10 text-[#0056b3]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h2 class="mb-4 text-2xl font-bold uppercase tracking-wider text-[#0056b3]">Our Mission</h2>
      <p class="text-lg leading-relaxed text-slate-600">{{ missionText }}</p>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-[#082447] py-6 text-center text-sm text-white">
  <p>© 2025 KSRCT CRFD. All Rights Reserved.</p>
</footer>
