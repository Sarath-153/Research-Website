<main class="mx-auto max-w-6xl px-6 py-16">
  <!-- Latest News Section -->
  <section class="mb-12">
    <div class="mb-5 flex items-center gap-3">
      <span class="inline-block h-6 w-1 rounded-full bg-[#082447]"></span>
      <h2 class="text-2xl font-bold tracking-tight text-[#082447]">Latest News</h2>
    </div>
    <div class="space-y-4">
      <div *ngFor="let item of latestNews" class="rounded-xl border-l-4 border-[#082447] bg-slate-50 p-6 shadow-sm transition hover:shadow-md">
        <h3 class="text-lg font-bold text-[#082447]">{{ item.title }}</h3>
        <p class="mt-1 text-slate-600">{{ item.org }}</p>
      </div>
    </div>
  </section>

  <!-- Upcoming Events Section -->
  <section class="mb-14">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="inline-block h-6 w-1 rounded-full bg-[#082447]"></span>
        <h2 class="text-2xl font-bold tracking-tight text-[#082447]">Upcoming Events</h2>
      </div>
      <span class="rounded-full bg-emerald-50 px-3.5 py-1 text-xs font-semibold text-emerald-700 ring-1 ring-emerald-600/20">
        ● Forthcoming
      </span>
    </div>

    <div class="grid gap-6 md:grid-cols-3">
      <article
        *ngFor="let ev of upcomingEvents"
        class="group flex flex-col justify-between rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-slate-300 hover:shadow-lg"
      >
        <div>
          <div class="mb-3.5 flex items-center justify-between gap-2">
            <span class="inline-block rounded-md bg-[#082447]/10 px-2.5 py-1 text-xs font-bold text-[#082447]">{{ ev.date }}</span>
            <span class="rounded bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600">{{ ev.category }}</span>
          </div>
          <h3 class="text-base font-bold text-slate-800 transition-colors group-hover:text-[#082447]">{{ ev.title }}</h3>
          <p *ngIf="ev.venue" class="mt-3 flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <span>📍</span> {{ ev.venue }}
          </p>
        </div>
      </article>
    </div>
  </section>

  <!-- Previous / Completed Events Section -->
  <section>
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="inline-block h-6 w-1 rounded-full bg-slate-400"></span>
        <h2 class="text-2xl font-bold tracking-tight text-[#082447]">Previous Events</h2>
      </div>
      <span class="rounded-full bg-slate-100 px-3.5 py-1 text-xs font-semibold text-slate-600 ring-1 ring-slate-300/40">
        Completed Events
      </span>
    </div>

    <div class="grid gap-6 md:grid-cols-3">
      <article
        *ngFor="let ev of previousEvents"
        class="flex flex-col justify-between rounded-xl border border-slate-200 bg-slate-50/70 p-6 shadow-sm transition hover:bg-white hover:shadow-md"
      >
        <div>
          <div class="mb-3.5 flex items-center justify-between gap-2">
            <span class="inline-block rounded-md bg-slate-200 px-2.5 py-1 text-xs font-bold text-slate-700">{{ ev.date }}</span>
            <span class="rounded bg-slate-200/70 px-2 py-0.5 text-[11px] font-semibold text-slate-500">Completed</span>
          </div>
          <h3 class="text-base font-bold text-slate-800">{{ ev.title }}</h3>
          <p *ngIf="ev.venue" class="mt-2 flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <span>📍</span> {{ ev.venue }}
          </p>
          <p *ngIf="ev.summary" class="mt-3 text-xs leading-relaxed text-slate-600">
            {{ ev.summary }}
          </p>
        </div>
      </article>
    </div>
  </section>
</main>

<footer class="bg-[#082447] py-6 text-center text-sm text-white">
  <p>© 2025 KSRCT CRFD. All Rights Reserved.</p>
</footer>
