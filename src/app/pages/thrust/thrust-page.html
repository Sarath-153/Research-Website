<div class="thrust-page min-h-screen bg-white text-[#333]">
  <section class="bg-gradient-to-r from-[#002147] to-[#0056b3] py-10 text-center text-white">
    <p class="text-xs font-semibold tracking-widest uppercase opacity-80">Home &gt; Research Ecosystem &gt; Thrust Areas</p>
    <h1 class="mt-2 text-3xl font-extrabold md:text-4xl">Thrust Areas</h1>
  </section>

  <main class="px-4 pb-16 pt-12 sm:px-6 lg:px-8">
    <section class="mx-auto grid w-full max-w-[1720px] grid-cols-1 gap-8 sm:grid-cols-2 xl:grid-cols-4" aria-label="Department thrust areas">
      <article *ngFor="let department of departments" class="dept-card">
        <img class="dept-image" [src]="department.image" [alt]="department.name" loading="lazy" />
        <h3>{{ department.name }}</h3>

        <div class="dept-divider"></div>
        <h4>Thrust Areas</h4>

        <ul>
          <li *ngFor="let area of department.areas.slice(0, 4)">{{ area }}</li>
        </ul>
      </article>
    </section>
  </main>

  <footer class="flex flex-wrap items-center justify-between gap-3 bg-[#082447] px-[8%] py-4 text-[14px] text-white">
    <div>
      Page Updated: {{ pageUpdated }} |
      <a class="mx-1 text-white no-underline" href="#">Terms of Use</a> |
      <a class="mx-1 text-white no-underline" href="#">Privacy Policy</a>
    </div>

    <div>
      &copy; 2025 KSRCT CRFD. All Rights Reserved.
      <span class="ml-3 inline-flex gap-5 font-extrabold">
        <a class="text-white no-underline" href="https://www.facebook.com/ksrct1994" target="_blank" rel="noopener">f</a>
        <a class="text-white no-underline" href="https://twitter.com/ksrct" target="_blank" rel="noopener">X</a>
        <a class="text-white no-underline" href="https://www.linkedin.com/school/k-s-rangasamy-college-of-technology/" target="_blank" rel="noopener">in</a>
      </span>
    </div>
  </footer>
</div>
