<section class="bg-gradient-to-r from-[#002147] to-[#0056b3] py-14 text-center text-white">
  <p class="text-xs font-semibold tracking-widest uppercase opacity-80">Home &gt; Downloads</p>
  <h1 class="mt-2 text-3xl font-extrabold md:text-4xl">Downloads &amp; Circulars</h1>
</section>

<main class="mx-auto max-w-5xl px-6 py-16">
  <p class="mb-10 text-lg leading-relaxed text-slate-700">
    Download official application forms, grant proposal templates, guidelines, and circulars issued by the Center for Research &amp; Development.
  </p>

  <div class="space-y-4">
    <div *ngFor="let d of downloads" class="flex items-center justify-between rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-[#0056b3]">
      <div>
        <h3 class="text-base font-bold text-[#002147]">{{ d.title }}</h3>
        <span class="text-xs font-semibold text-slate-500">Category: {{ d.cat }} | Size: {{ d.size }}</span>
      </div>
      <button class="inline-flex items-center gap-2 rounded-lg bg-[#0056b3] px-4 py-2 text-xs font-bold text-white hover:bg-[#002147]">
        Download
      </button>
    </div>
  </div>
</main>

<footer class="bg-[#082447] py-6 text-center text-sm text-white">
  <p>© 2025 KSRCT CRFD. All Rights Reserved.</p>
</footer>
