<section class="bg-gradient-to-r from-[#002147] to-[#0056b3] py-14 text-center text-white">
  <p class="text-xs font-semibold tracking-widest uppercase opacity-80">Home &gt; Consultancy</p>
  <h1 class="mt-2 text-3xl font-extrabold md:text-4xl">Consultancy Services</h1>
</section>

<main class="mx-auto max-w-6xl px-6 py-16">
  <p class="mb-10 text-center text-lg leading-relaxed text-slate-700">
    Research consultancy services offered by CFRD to industries, public sector undertakings, and academic institutions.
  </p>

  <div class="grid gap-8 md:grid-cols-3">
    <div *ngFor="let s of services" class="rounded-xl border border-slate-200 bg-white p-6 shadow-md transition hover:-translate-y-1 hover:shadow-xl">
      <h3 class="text-xl font-bold text-[#002147]">{{ s.title }}</h3>
      <p class="mt-1 text-xs font-bold uppercase tracking-wider text-[#0056b3]">{{ s.dept }}</p>
      <p class="mt-3 text-sm text-slate-600">{{ s.desc }}</p>
    </div>
  </div>
</main>

<footer class="bg-[#082447] py-6 text-center text-sm text-white">
  <p>© 2025 KSRCT CRFD. All Rights Reserved.</p>
</footer>
